# Builds SnowIsland.exe (Windows) and Snow Island.app (macOS) on GitHub's machines.
# - Every push: builds and runs a short self-test on both systems.
# - Pushing a tag like v1.1.0: also creates a GitHub Release with the downloads attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Self-test (runs the app for 8 seconds)
        env:
          SNOW_ISLAND_AUTOQUIT: "8"
        run: python snow_island.py
      - name: Build SnowIsland.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SnowIsland --icon assets\icon.ico --collect-submodules winrt snow_island.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnowIsland-windows
          path: dist/SnowIsland.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1 and newer)
          - runner: macos-15-intel     # Intel Macs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Self-test (runs the app for 8 seconds)
        env:
          SNOW_ISLAND_AUTOQUIT: "8"
        run: |
          set +e
          .venv/bin/python -X faulthandler snow_island.py 2> selftest-err.txt
          code=$?
          cat selftest-err.txt
          if [ $code -ne 0 ]; then
            python3 -c "t=open('selftest-err.txt').read()[-6000:]; print('::error title=Mac self-test crashed::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
          exit $code
      - name: Parser tests
        run: .venv/bin/python tests/test_mac_parsers.py
      - name: Build Snow Island.app
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SnowIsland-mac-${{ runner.arch }}
          path: dist/SnowIsland-mac-*.zip

  linux:
    # built on an older Ubuntu so the download also runs on older Linux versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for Qt and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Self-test (runs the app for 8 seconds on a virtual screen)
        env:
          SNOW_ISLAND_AUTOQUIT: "8"
        run: |
          set +e
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" \
            .venv/bin/python -X faulthandler snow_island.py 2> selftest-err.txt
          code=$?
          cat selftest-err.txt
          # show the end of any crash output as a note on the run (readable without signing in)
          if [ $code -ne 0 ]; then
            python3 -c "t=open('selftest-err.txt').read()[-6000:]; print('::error title=Linux self-test crashed::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
          exit $code
      - name: Parser tests
        run: .venv/bin/python tests/test_mac_parsers.py && .venv/bin/python tests/test_linux_parsers.py
      - name: Build SnowIsland-linux
        run: bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SnowIsland-linux
          path: dist/SnowIsland-linux-*

  release:
    # still publish when one Mac or Linux build fails
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: .github/release-notes.md
          generate_release_notes: true
